<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--=============== FAVICON ===============-->
    <link rel="shortcut icon" href="img/iconfav.png" type="image/x-icon">

    <!--=============== REMIXICONS ===============-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css">

    <!--=============== CSS ===============-->
    <link rel="stylesheet" href="style.css">
    <title>ASIRIS OCHOA</title>
</head>
<body>
    <header class="header" id="header">
        <nav class="nav container">
            <a href="" class="nav__logo">
                <img src="img/logotipo.png" alt="logo">
            </a>
            <div class="nav__menu" id="nav-menu">
                <ul class="nav__list">
                    <li>
                        <a href="#home" class="nav__link">INICIO</a>
                    </li>
                    <li>
                        <a href="#project" class="nav__link">PROYECTOS</a>
                    </li>
                    <li>
                        <a href="#service" class="nav__link">SERVICIOS</a>
                    </li>
                    <li>
                        <a href="#contact" class="nav__link">GALERÍA</a>
                    </li>
                </ul>
                <!-- Close button -->
                <div class="nav__close" id="nav-close">
                    <i class="ri-close-line"></i>
                </div>
            </div>
            <div class="nav__buttons">
                <!-- Theme button -->
                <i class="ri-circle-fill nav__theme" id="theme_button">CONTACTO</i> 
                
                <!-- Toggle button -->
                 <div class="nav__toggle" id="nav-toggle">
                    <i class="ri-menu-line"></i>
                 </div>
            </div>
        </nav>
    </header>
    <!--=============== MAIN ===============-->
    <main class="main">
        <!--=============== HOME ===============-->
        <section class="home section" id="home">
            <img src="img/banner.jpg" alt="banner" class="home__bg">
            <div></div>
        </section>
    </main>
    
    <!--=============== MAIN JS ===============-->
    <script src="js/main.js"></script>
</body>
</html>
