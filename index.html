<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--=============== FAVICON ===============-->
    <link rel="shortcut icon" href="img/iconfav.png" type="image/x-icon">

    <!--=============== REMIXICONS ===============-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css">

    <!--=============== CSS ===============-->
    <link rel="stylesheet" href="style.css">
    <title>ASIRIS OCHOA</title>
</head>
<body>
    <header class="header" id="header">
        <nav class="nav container">
            <a href="" class="nav__logo">
                <img src="img/logotipo.png" alt="logo">
            </a>
            <div class="nav__menu" id="nav-menu">
                <ul class="nav__list">
                    <li>
                        <a href="#home" class="nav__link">Inicio</a>
                    </li>
                    <li>
                        <a href="#project" class="nav__link">Proyectos</a>
                    </li>
                    <li>
                        <a href="#service" class="nav__link">Servicios</a>
                    </li>
                    <li>
                        <a href="#contact" class="nav__link">Galería</a>
                    </li>
                </ul>
                <!-- Close button -->
                <div class="nav__close" id="nav-close">
                    <i class="ri-close-line"></i>
                </div>
            </div>
            <div class="nav__buttons">
                <!-- Theme button -->
                <i class="ri-circle-fill nav__theme" id="theme_button"></i><p>&nbsp;&nbsp;CONTACTO</p>
                
                <!-- Toggle button -->
                <div class="nav__toggle" id="nav-toggle">
                <i class="ri-menu-line"></i>
                </div>
            </div>
        </nav>
    </header>
    <!--=============== MAIN ===============-->
    <main class="main">
        <!--=============== HOME ===============-->
        <section class="home section" id="home">
            <img src="img/banner.jpg" alt="banner" class="home__bg">
            <div class="home__blur"></div>
            <div class="home__container container grid">
                <div class="home__data">
                    <div class="home__data-p">
                        <p class="home__description">
                            <i class="ri-circle-fill"></i>
                            &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Desarrollamos soluciones integrales en arquitectura, diseño de interiores y mobiliario a medida.
                        </p>
                    </div>
                    <div class="home__data-h1">
                        <h1 class="home__title">
                        <span class="line-1">CREAR</span>
                        <span class="line-2">INTERIORES</span>
                        <span class="line-3">QUE INSPIRE.</span>
                        </h1>
                        <a href="#destinatario" class="button__opa-30">
                            <p class="button">DISCUTIR EL PROYECTO</p>
                            <i class="ri-circle-fill nav__circle"></i>
                        </a>
                    </div>
                </div>
            </div>
            <svg class="circle-lines" viewBox="0 0 1000 1000" aria-hidden="true">
            <circle cx="500" cy="500" r="320" />
            <circle cx="500" cy="500" r="320" />
            <circle cx="500" cy="500" r="320" />
            </svg>
        </section>
    </main>
    
    <!--=============== MAIN JS ===============-->
    <script src="js/main.js"></script>
</body>
</html>
